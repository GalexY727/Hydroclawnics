name: Deploy Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to SSH host
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "$DEPLOY_SSH_PRIVATE_KEY" ] || [ -z "$DEPLOY_HOST" ]; then
            echo "DEPLOY_SSH_PRIVATE_KEY and DEPLOY_HOST are required for SSH deploys."
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER:-ubuntu}@$DEPLOY_HOST" \
            "cd ${DEPLOY_PATH:-/home/ubuntu/Hydroclawnics} && git pull origin main && LLM_PROVIDER=none DEMO_MODE=true DEMO_AUTOSTART_AGENTS=true bash deploy.sh"
